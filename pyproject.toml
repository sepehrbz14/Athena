[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-crypto-bot"
version = "0.1.0"
description = "Paper-first, risk-managed crypto strategy research and backtesting toolkit"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["crypto_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
